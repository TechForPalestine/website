# Used only by the Astro Cloudflare adapter during `pnpm build` (via
# `configPath` in astro.config.mjs) — NOT read by Cloudflare Pages' own
# build orchestration, which always reads the root wrangler.toml directly.
#
# This file exists solely so the adapter sees an existing `assets.binding`
# and skips injecting its own default, which is hardcoded to "ASSETS" — a
# name Cloudflare Pages reserves internally and rejects at deploy time
# ("The name 'ASSETS' is reserved in Pages projects."). Pages' root-level
# wrangler.toml parser rejects the `[assets]` key outright regardless of
# the name used, which is why this can't just be added to wrangler.toml.
#
# Must otherwise mirror wrangler.toml's content — `configPath` fully
# replaces which file the adapter reads, it doesn't merge with the root
# file. Keep the two in sync by hand if either changes.
name = "website"
compatibility_flags = [ "nodejs_compat" ]
compatibility_date = "2024-09-23"

pages_build_output_dir = "dist"

[assets]
binding = "STATIC_ASSETS"

[[kv_namespaces]]
binding = "DROPPED_CONVERSIONS"
id = "2d428a3626f846ffaa58a589565f1829"
preview_id = "7dc503aa602743a398447364d31ffeb0"
